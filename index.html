<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Tic Tac Toe</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts & Font Awesome Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: rgba(18, 26, 43, 0.75);
            --neon-blue: #00f3ff;
            --neon-blue-glow: rgba(0, 243, 255, 0.6);
            --neon-pink: #ff0055;
            --neon-pink-glow: rgba(255, 0, 85, 0.6);
            --neon-purple: #b900ff;
            --neon-purple-glow: rgba(185, 0, 255, 0.4);
            --grid-line: rgba(0, 243, 255, 0.15);
        }

        body {
            background-color: var(--bg-color);
            font-family: 'Rajdhani', sans-serif;
            color: #e2e8f0;
            background-image: 
                radial-gradient(circle at 20% 20%, rgba(0, 243, 255, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 80% 80%, rgba(255, 0, 85, 0.08) 0%, transparent 40%),
                linear-gradient(to right, rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 40px 40px, 40px 40px;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .font-orbitron {
            font-family: 'Orbitron', sans-serif;
        }

        /* Neon Text Glow Effects */
        .text-glow-blue {
            color: var(--neon-blue);
            text-shadow: 0 0 8px var(--neon-blue-glow), 0 0 20px var(--neon-blue-glow);
        }

        .text-glow-pink {
            color: var(--neon-pink);
            text-shadow: 0 0 8px var(--neon-pink-glow), 0 0 20px var(--neon-pink-glow);
        }

        .text-glow-purple {
            color: var(--neon-purple);
            text-shadow: 0 0 8px var(--neon-purple-glow), 0 0 18px var(--neon-purple-glow);
        }

        /* Neon Box Glows */
        .box-glow-blue {
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.3), inset 0 0 15px rgba(0, 243, 255, 0.15);
            border-color: var(--neon-blue);
        }

        .box-glow-pink {
            box-shadow: 0 0 15px rgba(255, 0, 85, 0.3), inset 0 0 15px rgba(255, 0, 85, 0.15);
            border-color: var(--neon-pink);
        }

        .neon-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        /* Mode & Selector Buttons */
        .btn-neon {
            position: relative;
            transition: all 0.25s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            overflow: hidden;
        }

        .btn-neon::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: 0.5s;
        }

        .btn-neon:hover::before {
            left: 100%;
        }

        .btn-active-blue {
            background: rgba(0, 243, 255, 0.15);
            border-color: var(--neon-blue);
            color: var(--neon-blue);
            box-shadow: 0 0 12px rgba(0, 243, 255, 0.4);
        }

        .btn-active-pink {
            background: rgba(255, 0, 85, 0.15);
            border-color: var(--neon-pink);
            color: var(--neon-pink);
            box-shadow: 0 0 12px rgba(255, 0, 85, 0.4);
        }

        /* Cell Styling */
        .cell {
            background: rgba(15, 23, 42, 0.7);
            border: 2px solid rgba(0, 243, 255, 0.12);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            cursor: pointer;
            user-select: none;
        }

        .cell:hover:not(.disabled) {
            border-color: rgba(0, 243, 255, 0.5);
            background: rgba(0, 243, 255, 0.06);
            transform: scale(1.02);
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.2);
        }

        .cell.win-cell-x {
            animation: pulse-win-x 1.2s infinite alternate;
            background: rgba(0, 243, 255, 0.2) !important;
            border-color: var(--neon-blue) !important;
        }

        .cell.win-cell-o {
            animation: pulse-win-o 1.2s infinite alternate;
            background: rgba(255, 0, 85, 0.2) !important;
            border-color: var(--neon-pink) !important;
        }

        @keyframes pulse-win-x {
            0% { box-shadow: 0 0 10px var(--neon-blue-glow); }
            100% { box-shadow: 0 0 25px var(--neon-blue), inset 0 0 15px var(--neon-blue); }
        }

        @keyframes pulse-win-o {
            0% { box-shadow: 0 0 10px var(--neon-pink-glow); }
            100% { box-shadow: 0 0 25px var(--neon-pink), inset 0 0 15px var(--neon-pink); }
        }

        /* Symbol Pop Animation */
        .symbol-pop {
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes popIn {
            0% { transform: scale(0) rotate(-20deg); opacity: 0; }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }

        /* Overlay Animated Modal */
        .modal-enter {
            animation: modalFadeIn 0.4s ease forwards;
        }

        @keyframes modalFadeIn {
            0% { opacity: 0; transform: scale(0.85); }
            100% { opacity: 1; transform: scale(1); }
        }

        /* SVG Dynamic Winning Line */
        #winning-line-svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 20;
        }

        .winning-line-path {
            stroke-dasharray: 1000;
            stroke-dashoffset: 1000;
            animation: drawLine 0.5s ease-out forwards;
        }

        @keyframes drawLine {
            to { stroke-dashoffset: 0; }
        }
    </style>
</head>
<body class="flex flex-col items-center justify-between p-4 min-h-screen">

    <!-- Header Section -->
    <header class="w-full max-w-lg flex items-center justify-between py-2 mb-2">
        <div class="flex items-center space-x-3">
            <i class="fa-solid fa-bolt text-2xl text-glow-blue"></i>
            <h1 class="text-2xl sm:text-3xl font-black font-orbitron tracking-wider text-glow-blue">
                NEON<span class="text-glow-pink">.XO</span>
            </h1>
        </div>
        <!-- Audio & Settings Control -->
        <button id="sound-toggle" class="px-3 py-2 rounded-xl bg-slate-800/80 border border-slate-700 hover:border-cyan-400 text-slate-300 transition-all flex items-center space-x-2">
            <i id="sound-icon" class="fa-solid fa-volume-high text-cyan-400"></i>
            <span id="sound-text" class="text-xs font-bold font-orbitron tracking-widest hidden sm:inline">SFX ON</span>
        </button>
    </header>

    <!-- Main Game Container -->
    <main class="w-full max-w-md flex flex-col items-center my-auto space-y-4">

        <!-- Mode Selectors -->
        <div class="w-full neon-card rounded-2xl p-1.5 flex justify-between gap-1 border border-slate-800">
            <button id="mode-pvp" class="btn-neon flex-1 py-2.5 rounded-xl text-xs sm:text-sm font-orbitron font-bold border border-transparent transition-all btn-active-blue flex items-center justify-center space-x-2">
                <i class="fa-solid fa-user-group"></i>
                <span>2 PLAYER</span>
            </button>
            <button id="mode-ai" class="btn-neon flex-1 py-2.5 rounded-xl text-xs sm:text-sm font-orbitron font-bold border border-transparent text-slate-400 hover:text-slate-200 transition-all flex items-center justify-center space-x-2">
                <i class="fa-solid fa-robot"></i>
                <span>VS AI</span>
            </button>
        </div>

        <!-- AI Difficulty Sub-Bar (Hidden in PvP) -->
        <div id="ai-difficulty-container" class="w-full flex items-center justify-between neon-card rounded-xl px-4 py-2 text-xs font-orbitron hidden">
            <span class="text-slate-400">DIFFICULTY:</span>
            <div class="flex space-x-2">
                <button id="diff-easy" class="px-3 py-1 rounded-lg border border-slate-700 text-slate-400 hover:text-cyan-400 transition-all">EASY</button>
                <button id="diff-hard" class="px-3 py-1 rounded-lg border border-cyan-400 text-cyan-400 bg-cyan-950/40 font-bold box-glow-blue transition-all">UNBEATABLE</button>
            </div>
        </div>

        <!-- Scoreboard -->
        <div class="w-full neon-card rounded-2xl p-3 sm:p-4 grid grid-cols-3 gap-2 text-center">
            <!-- Player X Score -->
            <div id="score-x-card" class="flex flex-col items-center justify-center p-2 rounded-xl border border-cyan-500/30 bg-cyan-950/10 box-glow-blue transition-all">
                <span id="label-x" class="text-xs font-orbitron font-bold text-cyan-400">PLAYER X</span>
                <span id="score-x" class="text-2xl sm:text-3xl font-black font-orbitron text-glow-blue mt-1">0</span>
            </div>
            <!-- Draws -->
            <div class="flex flex-col items-center justify-center p-2 rounded-xl border border-purple-500/20 bg-purple-950/10 transition-all">
                <span class="text-xs font-orbitron font-bold text-purple-400">DRAWS</span>
                <span id="score-draws" class="text-2xl sm:text-3xl font-black font-orbitron text-glow-purple mt-1">0</span>
            </div>
            <!-- Player O Score -->
            <div id="score-o-card" class="flex flex-col items-center justify-center p-2 rounded-xl border border-pink-500/20 bg-pink-950/10 transition-all">
                <span id="label-o" class="text-xs font-orbitron font-bold text-pink-400">PLAYER O</span>
                <span id="score-o" class="text-2xl sm:text-3xl font-black font-orbitron text-glow-pink mt-1">0</span>
            </div>
        </div>

        <!-- Turn Status Indicator -->
        <div class="w-full neon-card rounded-xl py-2 px-4 flex items-center justify-between text-sm font-orbitron">
            <span class="text-slate-400 text-xs sm:text-sm">STATUS:</span>
            <div id="turn-indicator" class="flex items-center space-x-2 font-bold text-glow-blue">
                <span id="turn-symbol" class="text-lg">X</span>
                <span id="turn-text" class="tracking-wider text-xs sm:text-sm">'S TURN</span>
            </div>
        </div>

        <!-- Tic Tac Toe Game Grid -->
        <div class="relative w-full aspect-square max-w-[360px] sm:max-w-[380px] p-3 neon-card rounded-3xl border border-slate-800 shadow-2xl flex items-center justify-center">
            <!-- Grid SVG Overlay for Line Drawing -->
            <svg id="winning-line-svg" class="absolute inset-0 w-full h-full p-3 pointer-events-none">
                <line id="winning-line" class="winning-line-path" x1="0" y1="0" x2="0" y2="0" stroke="#00f3ff" stroke-width="8" stroke-linecap="round" style="display: none;" />
            </svg>

            <div id="board" class="w-full h-full grid grid-cols-3 grid-rows-3 gap-2.5">
                <!-- 9 Grid Cells generated via JS or structured here -->
                <button class="cell rounded-2xl flex items-center justify-center text-4xl sm:text-5xl font-orbitron font-black" data-index="0"></button>
                <button class="cell rounded-2xl flex items-center justify-center text-4xl sm:text-5xl font-orbitron font-black" data-index="1"></button>
                <button class="cell rounded-2xl flex items-center justify-center text-4xl sm:text-5xl font-orbitron font-black" data-index="2"></button>
                <button class="cell rounded-2xl flex items-center justify-center text-4xl sm:text-5xl font-orbitron font-black" data-index="3"></button>
                <button class="cell rounded-2xl flex items-center justify-center text-4xl sm:text-5xl font-orbitron font-black" data-index="4"></button>
                <button class="cell rounded-2xl flex items-center justify-center text-4xl sm:text-5xl font-orbitron font-black" data-index="5"></button>
                <button class="cell rounded-2xl flex items-center justify-center text-4xl sm:text-5xl font-orbitron font-black" data-index="6"></button>
                <button class="cell rounded-2xl flex items-center justify-center text-4xl sm:text-5xl font-orbitron font-black" data-index="7"></button>
                <button class="cell rounded-2xl flex items-center justify-center text-4xl sm:text-5xl font-orbitron font-black" data-index="8"></button>
            </div>
        </div>

        <!-- Controls Row -->
        <div class="w-full flex justify-between gap-3 pt-1">
            <button id="btn-restart" class="btn-neon flex-1 py-3 rounded-xl bg-slate-800/80 hover:bg-slate-700/80 border border-slate-600 hover:border-cyan-400 text-slate-200 font-orbitron font-bold text-xs tracking-wider flex items-center justify-center space-x-2 transition-all">
                <i class="fa-solid fa-rotate-right text-cyan-400"></i>
                <span>RESET BOARD</span>
            </button>
            <button id="btn-reset-scores" class="btn-neon px-4 py-3 rounded-xl bg-slate-900/80 hover:bg-slate-800/80 border border-slate-700 hover:border-pink-500 text-slate-400 hover:text-pink-400 font-orbitron font-bold text-xs tracking-wider flex items-center justify-center space-x-2 transition-all">
                <i class="fa-solid fa-trash-can"></i>
                <span class="hidden sm:inline">RESET SCORES</span>
            </button>
        </div>

    </main>

    <!-- Footer -->
    <footer class="mt-4 text-center text-slate-500 text-xs font-orbitron tracking-widest">
        NEON GLOW EDITION &bull; SYNTH AUDIO ACTIVE
    </footer>

    <!-- Result Celebration Modal Overlay -->
    <div id="modal-overlay" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md z-50 flex items-center justify-center p-4 hidden">
        <div class="modal-enter neon-card max-w-sm w-full rounded-3xl p-6 text-center border border-cyan-500/40 box-glow-blue flex flex-col items-center space-y-5">
            <div id="modal-icon-container" class="w-20 h-20 rounded-full flex items-center justify-center bg-cyan-950/50 border-2 border-cyan-400 box-glow-blue text-4xl">
                <i id="modal-icon" class="fa-solid fa-trophy text-glow-blue"></i>
            </div>

            <div>
                <h2 id="modal-title" class="text-2xl font-black font-orbitron text-glow-blue tracking-wide">VICTORY!</h2>
                <p id="modal-subtitle" class="text-sm font-semibold text-slate-300 mt-1">PLAYER X DOMINATES THE MATRIX</p>
            </div>

            <button id="modal-btn-play" class="btn-neon w-full py-3.5 rounded-xl font-orbitron font-black text-sm tracking-wider text-slate-950 bg-cyan-400 hover:bg-cyan-300 box-glow-blue transition-all">
                PLAY AGAIN
            </button>
        </div>
    </div>

    <!-- Web Audio & Game Engine Logic Script -->
    <script>
        /* --- WEB AUDIO API SYNTHESIZER --- */
        class SoundEffects {
            constructor() {
                this.ctx = null;
                this.muted = false;
            }

            init() {
                if (!this.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioContext();
                }
                if (this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }

            playTone(freq, type, duration, startVol = 0.1, endVol = 0) {
                if (this.muted) return;
                this.init();
                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                    gain.gain.setValueAtTime(startVol, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(endVol > 0 ? endVol : 0.0001, this.ctx.currentTime + duration);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + duration);
                } catch (e) { console.error(e); }
            }

            playClickX() {
                this.playTone(520, 'sine', 0.1, 0.15);
                setTimeout(() => this.playTone(780, 'triangle', 0.12, 0.1), 40);
            }

            playClickO() {
                this.playTone(340, 'sine', 0.1, 0.15);
                setTimeout(() => this.playTone(240, 'sawtooth', 0.12, 0.08), 40);
            }

            playWin() {
                if (this.muted) return;
                const notes = [440, 554.37, 659.25, 880];
                notes.forEach((freq, idx) => {
                    setTimeout(() => {
                        this.playTone(freq, 'triangle', 0.25, 0.2, 0.01);
                    }, idx * 90);
                });
            }

            playDraw() {
                if (this.muted) return;
                const notes = [300, 280, 260, 220];
                notes.forEach((freq, idx) => {
                    setTimeout(() => {
                        this.playTone(freq, 'sawtooth', 0.2, 0.12, 0.01);
                    }, idx * 100);
                });
            }

            playReset() {
                this.playTone(600, 'sine', 0.08, 0.1);
                setTimeout(() => this.playTone(400, 'sine', 0.08, 0.1), 50);
            }
        }

        const sounds = new SoundEffects();

        /* --- GAME ENGINE & STATE --- */
        const WINNING_COMBOS = [
            [0, 1, 2], [3, 4, 5], [6, 7, 8], // Rows
            [0, 3, 6], [1, 4, 7], [2, 5, 8], // Columns
            [0, 4, 8], [2, 4, 6]             // Diagonals
        ];

        let boardState = Array(9).fill('');
        let currentPlayer = 'X';
        let isGameActive = true;
        let gameMode = 'pvp'; // 'pvp' or 'ai'
        let aiDifficulty = 'hard'; // 'easy' or 'hard'
        let scores = { X: 0, O: 0, draws: 0 };

        // DOM Elements
        const cells = document.querySelectorAll('.cell');
        const turnIndicator = document.getElementById('turn-indicator');
        const turnSymbol = document.getElementById('turn-symbol');
        const turnText = document.getElementById('turn-text');
        const scoreXEl = document.getElementById('score-x');
        const scoreOEl = document.getElementById('score-o');
        const scoreDrawsEl = document.getElementById('score-draws');
        const labelXEl = document.getElementById('label-x');
        const labelOEl = document.getElementById('label-o');
        const scoreXCard = document.getElementById('score-x-card');
        const scoreOCard = document.getElementById('score-o-card');

        const modePvpBtn = document.getElementById('mode-pvp');
        const modeAiBtn = document.getElementById('mode-ai');
        const aiDiffContainer = document.getElementById('ai-difficulty-container');
        const diffEasyBtn = document.getElementById('diff-easy');
        const diffHardBtn = document.getElementById('diff-hard');

        const soundToggleBtn = document.getElementById('sound-toggle');
        const soundIcon = document.getElementById('sound-icon');
        const soundText = document.getElementById('sound-text');

        const btnRestart = document.getElementById('btn-restart');
        const btnResetScores = document.getElementById('btn-reset-scores');

        const modalOverlay = document.getElementById('modal-overlay');
        const modalTitle = document.getElementById('modal-title');
        const modalSubtitle = document.getElementById('modal-subtitle');
        const modalIcon = document.getElementById('modal-icon');
        const modalIconContainer = document.getElementById('modal-icon-container');
        const modalBtnPlay = document.getElementById('modal-btn-play');

        const winningLineSvg = document.getElementById('winning-line-svg');
        const winningLine = document.getElementById('winning-line');

        // Initial setup
        window.addEventListener('DOMContentLoaded', () => {
            initGame();
        });

        function initGame() {
            cells.forEach(cell => {
                cell.addEventListener('click', handleCellClick);
            });

            modePvpBtn.addEventListener('click', () => setMode('pvp'));
            modeAiBtn.addEventListener('click', () => setMode('ai'));
            diffEasyBtn.addEventListener('click', () => setDifficulty('easy'));
            diffHardBtn.addEventListener('click', () => setDifficulty('hard'));

            soundToggleBtn.addEventListener('click', toggleSound);
            btnRestart.addEventListener('click', () => { sounds.playReset(); resetBoard(); });
            btnResetScores.addEventListener('click', resetScores);
            modalBtnPlay.addEventListener('click', closeModalAndReset);

            window.addEventListener('resize', updateWinningLinePosition);
            resetBoard();
        }

        /* Mode & Difficulty Switches */
        function setMode(mode) {
            if (gameMode === mode) return;
            sounds.playReset();
            gameMode = mode;

            if (mode === 'pvp') {
                modePvpBtn.className = 'btn-neon flex-1 py-2.5 rounded-xl text-xs sm:text-sm font-orbitron font-bold border border-transparent transition-all btn-active-blue flex items-center justify-center space-x-2';
                modeAiBtn.className = 'btn-neon flex-1 py-2.5 rounded-xl text-xs sm:text-sm font-orbitron font-bold border border-transparent text-slate-400 hover:text-slate-200 transition-all flex items-center justify-center space-x-2';
                aiDiffContainer.classList.add('hidden');
                labelXEl.textContent = 'PLAYER X';
                labelOEl.textContent = 'PLAYER O';
            } else {
                modeAiBtn.className = 'btn-neon flex-1 py-2.5 rounded-xl text-xs sm:text-sm font-orbitron font-bold border border-transparent transition-all btn-active-pink flex items-center justify-center space-x-2';
                modePvpBtn.className = 'btn-neon flex-1 py-2.5 rounded-xl text-xs sm:text-sm font-orbitron font-bold border border-transparent text-slate-400 hover:text-slate-200 transition-all flex items-center justify-center space-x-2';
                aiDiffContainer.classList.remove('hidden');
                labelXEl.textContent = 'YOU (X)';
                labelOEl.textContent = 'AI (O)';
            }
            resetScores();
            resetBoard();
        }

        function setDifficulty(diff) {
            if (aiDifficulty === diff) return;
            sounds.playReset();
            aiDifficulty = diff;
            if (diff === 'easy') {
                diffEasyBtn.className = 'px-3 py-1 rounded-lg border border-pink-400 text-pink-400 bg-pink-950/40 font-bold box-glow-pink transition-all';
                diffHardBtn.className = 'px-3 py-1 rounded-lg border border-slate-700 text-slate-400 hover:text-cyan-400 transition-all';
            } else {
                diffHardBtn.className = 'px-3 py-1 rounded-lg border border-cyan-400 text-cyan-400 bg-cyan-950/40 font-bold box-glow-blue transition-all';
                diffEasyBtn.className = 'px-3 py-1 rounded-lg border border-slate-700 text-slate-400 hover:text-pink-400 transition-all';
            }
            resetBoard();
        }

        function toggleSound() {
            sounds.muted = !sounds.muted;
            if (sounds.muted) {
                soundIcon.className = 'fa-solid fa-volume-xmark text-slate-500';
                soundText.textContent = 'SFX OFF';
                soundText.classList.add('text-slate-500');
            } else {
                soundIcon.className = 'fa-solid fa-volume-high text-cyan-400';
                soundText.textContent = 'SFX ON';
                soundText.classList.remove('text-slate-500');
                sounds.playTone(600, 'sine', 0.1, 0.1);
            }
        }

        /* Core Gameplay Mechanics */
        function handleCellClick(e) {
            const cell = e.currentTarget;
            const index = parseInt(cell.getAttribute('data-index'));

            if (boardState[index] !== '' || !isGameActive) return;

            makeMove(index, currentPlayer);

            if (isGameActive && gameMode === 'ai' && currentPlayer === 'O') {
                disableBoardInput(true);
                setTimeout(() => {
                    makeAiMove();
                    disableBoardInput(false);
                }, 400);
            }
        }

        function makeMove(index, player) {
            boardState[index] = player;
            const cell = cells[index];
            cell.classList.add('disabled');

            const symbolSpan = document.createElement('span');
            symbolSpan.className = `symbol-pop ${player === 'X' ? 'text-glow-blue' : 'text-glow-pink'}`;
            symbolSpan.textContent = player;
            cell.appendChild(symbolSpan);

            if (player === 'X') {
                sounds.playClickX();
            } else {
                sounds.playClickO();
            }

            const winCombo = checkWin(boardState, player);

            if (winCombo) {
                handleWin(player, winCombo);
            } else if (boardState.every(c => c !== '')) {
                handleDraw();
            } else {
                switchTurn();
            }
        }

        function switchTurn() {
            currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
            updateTurnUI();
        }

        function updateTurnUI() {
            turnSymbol.textContent = currentPlayer;
            if (currentPlayer === 'X') {
                turnIndicator.className = 'flex items-center space-x-2 font-bold text-glow-blue';
                turnText.textContent = gameMode === 'ai' ? "'S TURN (YOU)" : "'S TURN";
                scoreXCard.classList.add('box-glow-blue');
                scoreOCard.classList.remove('box-glow-pink');
            } else {
                turnIndicator.className = 'flex items-center space-x-2 font-bold text-glow-pink';
                turnText.textContent = gameMode === 'ai' ? "'S TURN (AI)" : "'S TURN";
                scoreOCard.classList.add('box-glow-pink');
                scoreXCard.classList.remove('box-glow-blue');
            }
        }

        function disableBoardInput(disable) {
            cells.forEach(cell => {
                if (disable) {
                    cell.classList.add('pointer-events-none');
                } else if (boardState[cell.getAttribute('data-index')] === '') {
                    cell.classList.remove('pointer-events-none');
                }
            });
        }

        /* AI Logic: Easy & Unbeatable Minimax */
        function makeAiMove() {
            if (!isGameActive) return;

            let bestIndex;
            if (aiDifficulty === 'easy') {
                // Easy mode: 70% random, 30% smart move
                if (Math.random() < 0.7) {
                    const emptyIndices = boardState.map((val, idx) => val === '' ? idx : null).filter(val => val !== null);
                    bestIndex = emptyIndices[Math.floor(Math.random() * emptyIndices.length)];
                } else {
                    bestIndex = minimax(boardState, 'O').index;
                }
            } else {
                // Unbeatable Minimax
                bestIndex = minimax(boardState, 'O').index;
            }

            if (bestIndex !== undefined && bestIndex !== null) {
                makeMove(bestIndex, 'O');
            }
        }

        function minimax(newBoard, player) {
            const availSpots = newBoard.map((val, idx) => val === '' ? idx : null).filter(val => val !== null);

            if (checkWin(newBoard, 'X')) {
                return { score: -10 };
            } else if (checkWin(newBoard, 'O')) {
                return { score: 10 };
            } else if (availSpots.length === 0) {
                return { score: 0 };
            }

            const moves = [];
            for (let i = 0; i < availSpots.length; i++) {
                const move = {};
                move.index = availSpots[i];
                newBoard[availSpots[i]] = player;

                if (player === 'O') {
                    const result = minimax(newBoard, 'X');
                    move.score = result.score;
                } else {
                    const result = minimax(newBoard, 'O');
                    move.score = result.score;
                }

                newBoard[availSpots[i]] = '';
                moves.push(move);
            }

            let bestMove;
            if (player === 'O') {
                let bestScore = -10000;
                for (let i = 0; i < moves.length; i++) {
                    if (moves[i].score > bestScore) {
                        bestScore = moves[i].score;
                        bestMove = i;
                    }
                }
            } else {
                let bestScore = 10000;
                for (let i = 0; i < moves.length; i++) {
                    if (moves[i].score < bestScore) {
                        bestScore = moves[i].score;
                        bestMove = i;
                    }
                }
            }

            return moves[bestMove];
        }

        function checkWin(board, player) {
            for (let combo of WINNING_COMBOS) {
                if (board[combo[0]] === player && board[combo[1]] === player && board[combo[2]] === player) {
                    return combo;
                }
            }
            return null;
        }

        /* Win / Draw Handlers */
        let currentWinCombo = null;

        function handleWin(winner, combo) {
            isGameActive = false;
            currentWinCombo = combo;
            scores[winner]++;
            updateScoresUI();

            // Highlight Winning Cells
            combo.forEach(idx => {
                cells[idx].classList.add(winner === 'X' ? 'win-cell-x' : 'win-cell-o');
            });

            // Render SVG Animated Line
            drawWinningLine(combo, winner);

            sounds.playWin();

            setTimeout(() => {
                showModal(winner);
            }, 800);
        }

        function handleDraw() {
            isGameActive = false;
            scores.draws++;
            updateScoresUI();
            sounds.playDraw();

            setTimeout(() => {
                showModal('DRAW');
            }, 500);
        }

        function updateScoresUI() {
            scoreXEl.textContent = scores.X;
            scoreOEl.textContent = scores.O;
            scoreDrawsEl.textContent = scores.draws;
        }

        /* SVG Line Renderer */
        function drawWinningLine(combo, winner) {
            const firstCell = cells[combo[0]];
            const lastCell = cells[combo[2]];

            const boardRect = document.getElementById('board').getBoundingClientRect();
            const r1 = firstCell.getBoundingClientRect();
            const r2 = lastCell.getBoundingClientRect();

            const x1 = (r1.left + r1.width / 2) - boardRect.left;
            const y1 = (r1.top + r1.height / 2) - boardRect.top;
            const x2 = (r2.left + r2.width / 2) - boardRect.left;
            const y2 = (r2.top + r2.height / 2) - boardRect.top;

            winningLine.setAttribute('x1', x1);
            winningLine.setAttribute('y1', y1);
            winningLine.setAttribute('x2', x2);
            winningLine.setAttribute('y2', y2);
            winningLine.setAttribute('stroke', winner === 'X' ? '#00f3ff' : '#ff0055');
            winningLine.style.display = 'block';
        }

        function updateWinningLinePosition() {
            if (!isGameActive && currentWinCombo) {
                drawWinningLine(currentWinCombo, boardState[currentWinCombo[0]]);
            }
        }

        /* Modal Overlay Control */
        function showModal(result) {
            modalOverlay.classList.remove('hidden');

            if (result === 'X') {
                modalTitle.textContent = 'VICTORY!';
                modalTitle.className = 'text-2xl font-black font-orbitron text-glow-blue tracking-wide';
                modalSubtitle.textContent = gameMode === 'ai' ? 'YOU DEFEATED THE AI SYSTEM!' : 'PLAYER X DOMINATES THE GAME!';
                modalIcon.className = 'fa-solid fa-trophy text-glow-blue';
                modalIconContainer.className = 'w-20 h-20 rounded-full flex items-center justify-center bg-cyan-950/50 border-2 border-cyan-400 box-glow-blue text-4xl';
            } else if (result === 'O') {
                modalTitle.textContent = gameMode === 'ai' ? 'SYSTEM OVERRIDE' : 'VICTORY!';
                modalTitle.className = 'text-2xl font-black font-orbitron text-glow-pink tracking-wide';
                modalSubtitle.textContent = gameMode === 'ai' ? 'THE AI HAS OUTSMARTED YOU!' : 'PLAYER O TAKES THE WIN!';
                modalIcon.className = gameMode === 'ai' ? 'fa-solid fa-robot text-glow-pink' : 'fa-solid fa-trophy text-glow-pink';
                modalIconContainer.className = 'w-20 h-20 rounded-full flex items-center justify-center bg-pink-950/50 border-2 border-pink-500 box-glow-pink text-4xl';
            } else {
                modalTitle.textContent = 'STALEMATE!';
                modalTitle.className = 'text-2xl font-black font-orbitron text-glow-purple tracking-wide';
                modalSubtitle.textContent = 'A PERFECT MATCH OF EQUALS!';
                modalIcon.className = 'fa-solid fa-handshake text-glow-purple';
                modalIconContainer.className = 'w-20 h-20 rounded-full flex items-center justify-center bg-purple-950/50 border-2 border-purple-500 box-glow-purple text-4xl';
            }
        }

        function closeModalAndReset() {
            modalOverlay.classList.add('hidden');
            resetBoard();
        }

        /* Board & Score Resets */
        function resetBoard() {
            boardState = Array(9).fill('');
            isGameActive = true;
            currentPlayer = 'X';
            currentWinCombo = null;

            cells.forEach(cell => {
                cell.innerHTML = '';
                cell.className = 'cell rounded-2xl flex items-center justify-center text-4xl sm:text-5xl font-orbitron font-black';
            });

            winningLine.style.display = 'none';
            disableBoardInput(false);
            updateTurnUI();
        }

        function resetScores() {
            sounds.playReset();
            scores = { X: 0, O: 0, draws: 0 };
            updateScoresUI();
        }
    </script>
</body>
</html>
